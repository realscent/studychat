<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>신성대 스마트드론건설</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="join-screen" class="auth-shell">
      <section class="auth-panel" aria-labelledby="site-title">
        <img class="auth-logo" src="/assets/shinsung-logo.jpg" alt="신성대학교 로고">
        <h1 id="site-title">신성대 스마트드론건설</h1>

        <form id="user-form" class="entry-form">
          <label for="nickname">닉네임</label>
          <div class="inline-field">
            <input id="nickname" name="nickname" autocomplete="nickname" maxlength="20" required>
            <button type="submit">입장</button>
          </div>
        </form>

        <form id="admin-form" class="entry-form admin-entry">
          <label for="admin-password">운영자 비밀번호</label>
          <div class="inline-field">
            <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">로그인</button>
          </div>
        </form>

        <p id="entry-error" class="error-text" role="alert"></p>
      </section>
    </div>

    <div id="app" class="app-shell" hidden>
      <header class="topbar">
        <div class="brand-lockup">
          <img class="brand-logo" src="/assets/shinsung-logo.jpg" alt="신성대학교 로고">
          <div>
            <p class="eyebrow">SHINSUNG UNIVERSITY</p>
            <h1>신성대 스마트드론건설</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <span id="role-chip" class="role-chip">사용자</span>
          <span id="count-chip" class="count-chip">0명 접속</span>
          <button id="leave-button" class="ghost-button" type="button">나가기</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="presence-panel" aria-labelledby="presence-title">
          <div class="panel-heading">
            <h2 id="presence-title">접속 목록</h2>
            <span id="list-summary">0명</span>
          </div>
          <ul id="user-list" class="user-list"></ul>
        </aside>

        <section class="activity-panel" aria-label="실시간 채팅">
          <div id="admin-controls" class="admin-controls" hidden>
            <div class="admin-actions">
              <button id="start-push-button" class="primary-button" type="button">푸쉬버튼</button>
              <button id="reset-push-button" class="secondary-button" type="button" hidden>초기화</button>
              <span id="push-progress" class="progress-text"></span>
            </div>
            <section class="blocklist-panel" aria-labelledby="blocklist-title">
              <div class="panel-heading compact-heading">
                <h2 id="blocklist-title">차단 IP</h2>
                <span id="blocklist-summary">0개</span>
              </div>
              <ul id="blocklist" class="blocklist"></ul>
            </section>
          </div>

          <section id="push-panel" class="push-panel" hidden>
            <div>
              <p class="eyebrow">PUSH</p>
              <h2 id="push-title">푸쉬버튼 진행 중</h2>
              <p id="push-description"></p>
            </div>
            <button id="press-push-button" class="primary-button" type="button">완료했습니다</button>
          </section>

          <div id="messages" class="messages" aria-live="polite"></div>

          <form id="chat-form" class="chat-form">
            <input id="chat-input" name="message" maxlength="500" autocomplete="off" placeholder="메시지 입력" required>
            <input id="file-input" type="file" multiple hidden>
            <button id="attach-button" class="secondary-button" type="button">첨부</button>
            <button type="submit">전송</button>
          </form>
          <p id="upload-status" class="upload-status" aria-live="polite"></p>
          <p id="room-error" class="error-text" role="alert"></p>
        </section>
      </main>
    </div>

    <div id="complete-modal" class="modal-backdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="complete-title">
        <h2 id="complete-title">모두 완료</h2>
        <p id="complete-message">접속한 모든 사용자가 푸쉬버튼을 눌렀습니다.</p>
        <button id="complete-ok-button" class="primary-button" type="button">OK</button>
      </section>
    </div>

    <div id="media-modal" class="media-backdrop" hidden>
      <section class="media-modal" role="dialog" aria-modal="true" aria-labelledby="media-caption">
        <button id="media-close-button" class="media-close-button" type="button" aria-label="닫기">×</button>
        <button id="media-prev-button" class="media-nav-button media-prev-button" type="button" aria-label="이전">‹</button>
        <div id="media-stage" class="media-stage"></div>
        <div class="media-toolbar" aria-label="확대 축소">
          <button id="media-zoom-out-button" type="button" aria-label="축소">−</button>
          <span id="media-zoom-value">100%</span>
          <button id="media-zoom-in-button" type="button" aria-label="확대">+</button>
          <button id="media-reset-button" type="button">초기화</button>
        </div>
        <p id="media-caption" class="media-caption"></p>
        <button id="media-next-button" class="media-nav-button media-next-button" type="button" aria-label="다음">›</button>
      </section>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
